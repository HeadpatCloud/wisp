[package]
name = "wisp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "wisp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wisp"
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
argon2 = { version = "0.5.3", features = ["std"] }
chacha20poly1305 = "0.10.1"
getrandom = "0.4"
zeroize = { version = "1.9.0", features = ["zeroize_derive", "serde"] }
base64 = "0.22"
# 0.62.0 to 0.62.5 can deadlock a handler that awaits reply.accept() (ours does not, fixed in
# 0.62.6); 0.62.5 and later hold back every channel while one waits for window: 0.62.4 it is
russh = { version = "=0.62.4", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3"
tauri-plugin-dialog = "2"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-util", "time", "net", "fs"] }
portable-pty = "0.9.0"
des = "^0.9"
suppaftp = { version = "12", default-features = false, features = ["native-tls"] }
keyring = { version = "4", features = ["v1"] }
rust-s3 = "0.37"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
hmac = "0.12"
time = "0.3"
futures-util = "0.3"
same-file = "1"
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
num-bigint = "0.4"
md5 = "0.8"
aes = { version = "0.9", features = ["zeroize"] }
flate2 = "1"
socket2 = { version = "0.6", features = ["all"] }
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-cliprdr = "0.7"
ironrdp-dvc = "0.8"
ironrdp-displaycontrol = "0.8"
ironrdp-pdu = "0.9"
ironrdp-graphics = "0.9"
ironrdp-input = "0.7"
ironrdp-svc = "0.8"
ironrdp-core = "0.2"
ironrdp-tokio = "0.10"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
# 0.12.5 adds an enum variant that sspi 0.23 matches exhaustively
picky-krb = "=0.12.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tauri = { version = "2", features = ["test"] }
ironrdp-server = { version = "0.13", default-features = false }
ironrdp-acceptor = "0.10"
anyhow = "1"
async-trait = "0.1"

# See vendor/ironrdp-connector/VENDORED.md, vendor/ironrdp-acceptor/VENDORED.md and
# vendor/ironrdp-async/VENDORED.md
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-acceptor = { path = "vendor/ironrdp-acceptor" }
ironrdp-async = { path = "vendor/ironrdp-async" }
